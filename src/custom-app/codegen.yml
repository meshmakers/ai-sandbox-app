overwrite: true
hooks:
  afterAllFileWrite:
    - node scripts/codegen-strip-incremental.mjs
# schema.graphql is the System schema of octo-frontend-libraries (src/frontend-libraries/schema.graphql at cb8bc5df), copied verbatim.
schema: 'schema.graphql'
documents: 'src/app/graphQL/*.graphql'
generates:
  src/app/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typeSuffix: 'Dto'
      scalars: &scalars
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typeSuffix: 'Dto'
      importSchemaTypesFrom: src/app/graphQL/globalTypes
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      scalars: *scalars
