version: 2

updates:
  - package-ecosystem: npm
    directory: /src/custom-app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/custom-app
    schedule:
      interval: weekly
    ignore:
      # The meshmakers platform images are bumped deliberately together with the
      # platform toolchain. Dependabot also misreads their legacy tag scheme
      # (8.0-<date> sorts above 1.3.0.0).
      - dependency-name: "meshmakers/*"
      # Base image majors are a deliberate platform decision, not a weekly bump.
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
